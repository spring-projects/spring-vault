name: vault
version: true
title: Spring Vault
nav:
  - modules/ROOT/nav.adoc
ext:
  collector:
    - run:
        command: ./mvnw validate process-resources -pl :spring-vault-distribution -am -Pantora-process-resources -Djava-module-name=spring.vault.core
        local: true
      scan:
        dir: spring-vault-distribution/target/classes/
    - run:
        command: ./mvnw package -Pdistribute -Djava-module-name=spring.vault.core
        local: true
      scan:
        dir: target/antora
