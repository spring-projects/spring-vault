name: Build and deploy snapshots

on:
  workflow_dispatch:
  push:
    branches: [ main, 4.0.x, 3.2.x, 3.1.x, 'issue/**', 'release/**' ]

permissions: read-all

jobs:
  build:
    name: Build and deploy snapshots
    if: ${{ github.repository_owner == 'spring-projects' }}
    runs-on: ${{ vars.ACTION_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Maven
        uses: spring-projects/spring-data-build/actions/setup-maven@3.5.x
        with:
          java-version: 'base'
          develocity-access-key: '${{ secrets.DEVELOCITY_ACCESS_KEY }}'

      - name: Install and Start Vault
        uses: ./.github/actions/setup-vault

      - name: Capture version
        run: |
          echo "PROJECT_VERSION=$(./ci/get-version.sh)" >> $GITHUB_ENV

      - name: Deploy to Artifactory
        if: ${{ github.repository_owner == 'spring-projects' && contains(env.PROJECT_VERSION, '-SNAPSHOT') }}
        uses: spring-projects/spring-data-build/actions/maven-artifactory-deploy@4.0.x
        env:
          OSS_ARTIFACTORY_USR: '${{ secrets.ARTIFACTORY_USERNAME }}'
          OSS_ARTIFACTORY_PSW: '${{ secrets.ARTIFACTORY_PASSWORD }}'
          COMMERCIAL_ARTIFACTORY_USR: '${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}'
          COMMERCIAL_ARTIFACTORY_PSW: '${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}'
        with:
          build-name: 'spring-vault'
          skip-tests: 'false'
          settings-xml: '${{ vars.SETTINGS_XML }}'
